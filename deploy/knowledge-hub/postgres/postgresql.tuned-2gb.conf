# BAI Knowledge Hub PostgreSQL 16 tuning profile
# Target: single shared VPS with ~2 GiB RAM (PostgreSQL + Knowledge API + reverse proxy + OS).
# This is a conservative starting profile, not a universal benchmark result.
# Measure real workload before increasing memory or parallelism.

# --- Paths / network ---------------------------------------------------------
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
listen_addresses = '*'
port = 5432

# --- Connection / memory budget ---------------------------------------------
# The API pool defaults to 10. Keep total server backends bounded on a 2 GiB host.
max_connections = 40
superuser_reserved_connections = 3
shared_buffers = '256MB'
effective_cache_size = '1GB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
autovacuum_work_mem = '64MB'
huge_pages = try

# --- WAL / durability --------------------------------------------------------
# Durability settings are intentionally not weakened for performance.
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
min_wal_size = '128MB'
max_wal_size = '1GB'

# --- Background / parallel work ---------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- Autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.10
autovacuum_analyze_scale_factor = 0.05

# --- Observability / operational safety -------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] db=%d user=%u app=%a client=%h '
log_min_duration_statement = '1000ms'
log_checkpoints = on
log_autovacuum_min_duration = '1000ms'
log_lock_waits = on
deadlock_timeout = '1s'
track_io_timing = on
idle_in_transaction_session_timeout = '60s'

# --- Query behavior / security ----------------------------------------------
# Knowledge Hub is short OLTP-style traffic; avoid JIT startup overhead.
jit = off
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'

# SSD-specific planner/I/O overrides are intentionally NOT forced here.
# Validate storage characteristics first, then consider random_page_cost and
# effective_io_concurrency as environment-specific overrides.
