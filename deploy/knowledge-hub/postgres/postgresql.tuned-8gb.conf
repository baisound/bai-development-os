# BAI Knowledge Hub PostgreSQL 16 tuning profile
# Target: single shared VPS with ~8 GiB RAM (PostgreSQL + Knowledge API + reverse proxy + OS).
# Startup-production profile for the Owner-selected 8 GiB host. Verify active settings after deployment.

# --- Paths / network ---------------------------------------------------------
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
listen_addresses = '*'
port = 5432

# --- Connection / memory budget ---------------------------------------------
# Keep connection count bounded; the API pool is the primary concurrency gate.
max_connections = 64
superuser_reserved_connections = 3
shared_buffers = '1536MB'
effective_cache_size = '5GB'
work_mem = '8MB'
maintenance_work_mem = '256MB'
autovacuum_work_mem = '256MB'
huge_pages = try

# --- WAL / durability --------------------------------------------------------
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
min_wal_size = '512MB'
max_wal_size = '4GB'

# --- Background / parallel work ---------------------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.10
autovacuum_analyze_scale_factor = 0.05

# --- Observability / operational safety -------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] db=%d user=%u app=%a client=%h '
log_min_duration_statement = '1000ms'
log_checkpoints = on
log_autovacuum_min_duration = '1000ms'
log_lock_waits = on
deadlock_timeout = '1s'
track_io_timing = on
idle_in_transaction_session_timeout = '60s'

# --- Query behavior / security ----------------------------------------------
jit = off
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'

# Keep storage-specific planner/I/O tuning out of the generic profile until
# target-disk Evidence exists.
