name: bai-knowledge-hub

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16.14-alpine}"
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: "${POSTGRES_SHM_SIZE:?set POSTGRES_SHM_SIZE via an explicit 2gb/4gb/8gb profile}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - knowledge_hub_postgres:/var/lib/postgresql/data
      - "${POSTGRES_CONFIG_FILE:?set POSTGRES_CONFIG_FILE via an explicit 2gb/4gb/8gb profile}:/etc/postgresql/postgresql.conf:ro"
      - ./postgres/verify-tuning.sql:/etc/postgresql/verify-tuning.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hub_internal]

  knowledge-migrate:
    build:
      context: ../..
      dockerfile: deploy/knowledge-hub/Dockerfile
    restart: "no"
    command: ["node", "deploy/knowledge-hub/runtime/migrate.mjs"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      BAI_KNOWLEDGE_HUB_RUNTIME_DB_USER: "${BAI_KNOWLEDGE_HUB_RUNTIME_DB_USER:?set runtime DB user}"
      BAI_KNOWLEDGE_HUB_RUNTIME_DB_PASSWORD: "${BAI_KNOWLEDGE_HUB_RUNTIME_DB_PASSWORD:?set runtime DB password}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hub_internal]

  knowledge-api:
    build:
      context: ../..
      dockerfile: deploy/knowledge-hub/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB}"
      PGUSER: "${BAI_KNOWLEDGE_HUB_RUNTIME_DB_USER:?set runtime DB user}"
      PGPASSWORD: "${BAI_KNOWLEDGE_HUB_RUNTIME_DB_PASSWORD:?set runtime DB password}"
      BAI_KNOWLEDGE_HUB_HOST: 0.0.0.0
      BAI_KNOWLEDGE_HUB_PORT: 8787
      BAI_KNOWLEDGE_HUB_RETENTION_DAYS: ${BAI_KNOWLEDGE_HUB_RETENTION_DAYS:-30}
      BAI_KNOWLEDGE_HUB_RATE_LIMIT_PER_MINUTE: ${BAI_KNOWLEDGE_HUB_RATE_LIMIT_PER_MINUTE:-120}
      BAI_KNOWLEDGE_HUB_BODY_LIMIT_BYTES: ${BAI_KNOWLEDGE_HUB_BODY_LIMIT_BYTES:-262144}
      BAI_KNOWLEDGE_HUB_DB_POOL_MAX: ${BAI_KNOWLEDGE_HUB_DB_POOL_MAX:-10}
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "deploy/knowledge-hub/runtime/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hub_internal]

  knowledge-admin:
    profiles: ["admin"]
    build:
      context: ../..
      dockerfile: deploy/knowledge-hub/Dockerfile
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hub_internal]

  caddy:
    image: caddy:2.11.4-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?set HUB_DOMAIN before public profile activation}
      BAI_KNOWLEDGE_HUB_ACME_CA_DIRECTORY: ${BAI_KNOWLEDGE_HUB_ACME_CA_DIRECTORY:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      knowledge-api:
        condition: service_healthy
    networks: [hub_internal]

networks:
  hub_internal:
    driver: bridge

volumes:
  knowledge_hub_postgres:
  caddy_data:
  caddy_config:
